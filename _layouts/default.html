<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }}{% unless page.url == '/' or page.url == '/notes/' %} | Naveen Kumar{% endunless %}</title>

  <!-- LinkedIn / Social OG Tags -->
  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="https://naveenkumar1661997.github.io/notes/"/>
  <meta property="og:title"       content="Naveen Kumar | Tech Knowledge Hub"/>
  <meta property="og:description" content="Senior Software Engineer at SmartStream Technologies. SQL, Java, AWS, Python, Docker, Airflow & Data Engineering notes — built for fast revision."/>
  <meta property="og:image"       content="https://naveenkumar1661997.github.io/notes/assets/preview.png"/>
  <meta name="twitter:card"       content="summary_large_image"/>
  <meta name="twitter:title"      content="Naveen Kumar | Tech Knowledge Hub"/>
  <meta name="twitter:description"content="SQL, Java, AWS, Python, Docker, Airflow notes by Naveen Kumar — Senior Software Engineer, Bengaluru"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg:       #090E1A;
      --surface:  #111827;
      --card:     #1A2236;
      --border:   #1E2D45;
      --accent:   #3B82F6;
      --accent2:  #06B6D4;
      --green:    #10B981;
      --yellow:   #F59E0B;
      --red:      #EF4444;
      --purple:   #8B5CF6;
      --orange:   #F97316;
      --text:     #E2E8F0;
      --muted:    #64748B;
      --code-bg:  #0D1526;
      --r:        8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.75}

    /* NAV */
    nav{
      position:sticky;top:0;z-index:100;
      background:rgba(9,14,26,.95);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:.75rem;
      padding:0 1.5rem;height:54px;
    }
    .nav-brand{
      font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.9rem;
      color:var(--accent2);text-decoration:none;display:flex;align-items:center;gap:6px;
    }
    .nav-brand span{color:var(--accent);opacity:.7}
    .nav-sp{flex:1}
    .nav-link{color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:500;padding:4px 10px;border-radius:6px;transition:.15s}
    .nav-link:hover{color:var(--text);background:var(--card)}
    .nav-li{background:rgba(10,102,194,.15);color:#0A66C2;border:1px solid rgba(10,102,194,.3);border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:600;text-decoration:none;transition:.15s}
    .nav-li:hover{background:rgba(10,102,194,.25)}

    /* LAYOUT */
    .wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}

    /* SIDEBAR */
    aside{
      border-right:1px solid var(--border);padding:1.25rem .75rem;
      position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;
    }
    aside::-webkit-scrollbar{width:4px}
    aside::-webkit-scrollbar-track{background:transparent}
    aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .sb-sec{margin-bottom:1.25rem}
    .sb-lbl{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 8px;margin-bottom:3px}
    .sb-link{
      display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;
      color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;transition:.15s;
    }
    .sb-link:hover{color:var(--text);background:var(--card)}
    .sb-link.active{color:var(--accent2);background:rgba(6,182,212,.08)}
    .sb-dot{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
    .dot-done{background:var(--green)}
    .dot-soon{background:var(--border)}

    /* MAIN */
    main{padding:2rem 2.5rem;max-width:920px}

    /* HEADINGS */
    h1{font-family:'JetBrains Mono',monospace;font-size:1.8rem;font-weight:700;margin-bottom:.4rem}
    h2{
      font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;
      color:var(--accent2);margin:2.5rem 0 .9rem;padding-bottom:.5rem;
      border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;
    }
    h2::before{content:'##';color:var(--accent);opacity:.4;font-size:.85rem}
    h3{font-size:.95rem;font-weight:700;color:var(--text);margin:1.25rem 0 .4rem}
    h4{font-size:.8rem;font-weight:700;color:var(--muted);margin:1rem 0 .3rem;text-transform:uppercase;letter-spacing:.06em}
    p{margin-bottom:.65rem}
    ul,ol{padding-left:1.5rem;margin:.4rem 0}
    li{margin:3px 0;font-size:.88rem}
    hr{border:none;border-top:1px solid var(--border);margin:2rem 0}

    /* HERO (topic pages) */
    .hero{
      background:linear-gradient(135deg,rgba(59,130,246,.08) 0%,rgba(6,182,212,.04) 100%);
      border:1px solid var(--border);border-radius:12px;padding:1.5rem 2rem;margin-bottom:1.75rem;
    }
    .hero .sub{color:var(--muted);font-size:.85rem;margin-top:3px;margin-bottom:0}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:.75rem}
    .tag{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}

    /* CALLOUTS */
    .box{border-left:3px solid;padding:.7rem 1rem;border-radius:0 var(--r) var(--r) 0;margin:.9rem 0;font-size:.85rem}
    .box b{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .tip {border-color:var(--green); background:rgba(16,185,129,.06)}
    .tip  b{color:var(--green)}
    .info{border-color:var(--accent2);background:rgba(6,182,212,.06)}
    .info b{color:var(--accent2)}
    .warn{border-color:var(--yellow);background:rgba(245,158,11,.06)}
    .warn b{color:var(--yellow)}
    .note{border-color:var(--purple);background:rgba(139,92,246,.06)}
    .note b{color:var(--purple)}

    /* CODE */
    code{font-family:'Fira Code',monospace;font-size:.82em;background:var(--code-bg);padding:2px 5px;border-radius:4px;color:var(--accent2);border:1px solid var(--border)}
    pre{
      background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r);
      padding:1.1rem 1.25rem;overflow-x:auto;margin:.9rem 0;position:relative;
    }
    pre::after{content:attr(data-lang);position:absolute;top:7px;right:10px;font-size:.65rem;font-weight:700;text-transform:uppercase;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
    pre code{font-size:.82rem;background:none;padding:0;border:none;color:var(--text);line-height:1.65}

    /* TABLES */
    .tw{overflow-x:auto;margin:.9rem 0;border-radius:var(--r);border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse}
    th{background:var(--card);font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border)}
    td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:.84rem;vertical-align:top}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.015)}
    td code{font-size:.78rem}

    /* MERMAID / DIAGRAMS */
    .diagram{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin:.9rem 0;overflow-x:auto;text-align:center}
    .diagram-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
    .mermaid{display:flex;justify-content:center}

    /* TOC */
    .toc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1.1rem;margin:1.25rem 0;font-size:.85rem}
    .toc-h{font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
    .toc ol{padding-left:1.1rem;margin:0}
    .toc li{margin:2px 0}
    .toc a{color:var(--muted);text-decoration:none}
    .toc a:hover{color:var(--accent2)}

    /* GRID UTILS */
    .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin:.75rem 0}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:.75rem 0}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:.75rem 0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem}
    .card h4{margin:0 0 5px;color:var(--accent2);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
    .card p{font-size:.8rem;color:var(--muted);margin:0}

    /* PORTFOLIO HERO (index page) */
    .ph{
      background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(6,182,212,.06),rgba(139,92,246,.06));
      border:1px solid var(--border);border-radius:16px;padding:2rem 2.25rem;
      margin-bottom:2rem;position:relative;overflow:hidden;
    }
    .ph::before{
      content:'';position:absolute;top:-60px;right:-60px;
      width:200px;height:200px;border-radius:50%;
      background:radial-gradient(circle,rgba(59,130,246,.15),transparent 70%);
    }
    .ph-row{display:flex;align-items:flex-start;gap:1.5rem}
    .ph-avatar{
      width:72px;height:72px;border-radius:16px;flex-shrink:0;
      background:linear-gradient(135deg,#3B82F6,#06B6D4);
      display:flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.4rem;color:#fff;
      box-shadow:0 0 30px rgba(59,130,246,.3);
    }
    .ph-name{font-family:'JetBrains Mono',monospace;font-size:1.6rem;font-weight:700;margin-bottom:2px}
    .ph-role{font-size:.9rem;color:var(--accent2);font-weight:600;margin-bottom:2px}
    .ph-company{font-size:.82rem;color:var(--muted);margin-bottom:.75rem}
    .ph-bio{font-size:.85rem;color:var(--muted);max-width:540px;line-height:1.6;margin-bottom:.9rem}
    .ph-stack{display:flex;gap:8px;flex-wrap:wrap}
    .ph-pill{
      font-size:.75rem;font-weight:600;padding:4px 11px;border-radius:999px;
      background:var(--card);border:1px solid var(--border);color:var(--text);
    }
    .ph-stats{display:flex;gap:1.5rem;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)}
    .ph-stat-n{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--accent2)}
    .ph-stat-l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

    /* TOPIC CARDS (index page) */
    .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:.9rem;margin-top:1.25rem}
    .tc{
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:1.1rem 1.25rem;text-decoration:none;display:block;
      transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;
    }
    .tc::after{
      content:'';position:absolute;inset:0;border-radius:10px;
      background:linear-gradient(135deg,var(--_c1,.3B82F6),transparent);
      opacity:0;transition:opacity .2s;
    }
    .tc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
    .tc-stripe{height:3px;border-radius:2px;margin-bottom:.9rem}
    .tc-icon{font-size:1.4rem;margin-bottom:6px}
    .tc-title{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px}
    .tc-desc{font-size:.78rem;color:var(--muted);line-height:1.55}
    .tc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:.7rem}
    .tc-tag{font-size:.63rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
    .tc-status{position:absolute;top:10px;right:10px;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px}
    .s-done{background:rgba(16,185,129,.15);color:var(--green)}
    .s-soon{background:rgba(100,116,139,.1);color:var(--muted)}

    /* AWS SERVICE CARDS */
    .aws-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin:.75rem 0}
    .aws-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
    .aws-head{font-weight:700;font-size:.82rem;margin-bottom:.4rem}
    .aws-items{font-size:.78rem;color:var(--muted);line-height:1.7}

    /* PIPELINE VISUAL */
    .pipe{display:flex;align-items:center;gap:0;margin:1rem 0;flex-wrap:wrap}
    .pipe-step{
      background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:.6rem .9rem;font-size:.78rem;font-weight:600;text-align:center;
      min-width:90px;position:relative;
    }
    .pipe-step .ps-icon{font-size:1.1rem;display:block;margin-bottom:2px}
    .pipe-arrow{color:var(--muted);font-size:1.1rem;padding:0 4px;flex-shrink:0}

    @media(max-width:768px){
      .wrap{grid-template-columns:1fr}
      aside{display:none}
      main{padding:1.25rem}
      .ph-row{flex-direction:column}
      .g2,.g3,.g4{grid-template-columns:1fr}
    }
  </style>
</head>

<div class="wrap">

      <a href="{{ site.baseurl }}/aws.html"           class="sb-link {% if page.url contains 'aws' %}active{% endif %}">☁️ AWS            <span class="sb-dot dot-done"></span></a>
      <a href="{{ site.baseurl }}/docker.html"        class="sb-link {% if page.url contains 'docker' %}active{% endif %}">🐳 Docker         <span class="sb-dot dot-done"></span></a>
      <a href="{{ site.baseurl }}/cicd.html"          class="sb-link {% if page.url contains 'cicd' %}active{% endif %}">🔄 CI/CD          <span class="sb-dot dot-done"></span></a>

    <div class="sb-sec">

      <a href="{{ site.baseurl }}/data-engineer.html" class="sb-link {% if page.url contains 'data-engineer' %}active{% endif %}">📊 Data Engineer  <span class="sb-dot dot-done"></span></a>

  </aside>

  <main>
    {{ content }}
  </main>

<script>

    startOnLoad: true, theme: 'dark',
