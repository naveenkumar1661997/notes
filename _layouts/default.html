<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != 'Notes' %}{{ page.title }} | Notes{% else %}Notes{% endif %}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'dark',
      flowchart: {
        htmlLabels: true,
        curve: 'basis'
      },
      themeVariables: {
        darkMode: true,
        background: '#161b22',
        primaryColor: '#1f293d',
        primaryBorderColor: '#38bdf8',
        primaryTextColor: '#f0f6fc',
        lineColor: '#58a6ff',
        secondaryColor: '#1e293b',
        tertiaryColor: '#090d13'
      }
    });

    function sanitizeMermaid(raw) {
      let code = raw
        // Decode HTML entities
        .replace(/&gt;/g, '>')
        .replace(/&lt;/g, '<')
        .replace(/&amp;/g, '&')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        // Normalize smart quotes and dashes
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/–>/g, '-->')
        .replace(/—>/g, '-->')
        // Convert literal \n into <br/> for Mermaid v10 HTML labels
        .replace(/\\n/g, '<br/>')
        .trim();

      // Fix spaces between arrow and edge label: `--> |label|` -> `-->|label|`
      code = code.replace(/-->\s+\|/g, '-->|');
      code = code.replace(/-\.->\s+\|/g, '-.->|');
      code = code.replace(/==>\s+\|/g, '==>|');

      // Quote unquoted edge labels `-->|start()|` or `-->|Spark / dbt|` so () and / never fail
      code = code.replace(/(-->|-\.->|==>)\|(?!")([^|]+)\|/g, function(_, arrow, label) {
        return arrow + '|"' + label.trim().replace(/"/g, "'") + '"|';
      });

      // Rename reserved Mermaid keywords when used as standalone node IDs
      code = code.replace(/\b(LEFT|RIGHT|END|CLASS|STYLE|DEFAULT)\b(?=\s*\[\vert{}\s*-->\vert{}\s*$)/gm, '$1_NODE');        // Ensure square-bracket labels ID[text] without quotes are wrapped in double quotes ID["text"] code = code.replace(/([A-Za-z0-9_]+)\[(?!")([^\]]+)\]/g, function(_, id, label) {
        return id + '["' + label.replace(/"/g, "'") + '"]';
      });

      return code;
    }

    document.addEventListener("DOMContentLoaded", async function () {
      const blocks = document.querySelectorAll('.mermaid');
      for (let i = 0; i < blocks.length; i++) {
        const el = blocks[i];
        const rawCode = el.textContent || el.innerText;
        const cleaned = sanitizeMermaid(rawCode);
        try {
          const { svg } = await mermaid.render('mermaid-svg-' + i, cleaned);
          el.innerHTML = svg;
        } catch (err) {
          console.error('Mermaid render error on block ' + i + ':', err, cleaned);
          el.innerHTML = '<pre style="color:#79c0ff;font-size:0.82rem;text-align:left;">' + cleaned.replace(/<br\/>/g, '\n') + '</pre>';
        }
      }
    });
  </script>

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --tag-bg: #21262d;
      --code-bg: #090d13;
      --warning: #d29922;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    /* Sticky Top Navigation */
    .top-nav {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .nav-logo {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-bright);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }

    /* Main Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px 20px;
    }

    /* Topic Grid (.tg) & Cards (.tc) */
    .tg {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin: 24px 0 40px 0;
    }
    .tc {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .tc:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .tc-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }
    .tc-status {
      align-self: flex-end;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tc-status.s-done {
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.4);
    }
    .tc-icon {
      font-size: 2rem;
      margin: 8px 0;
    }
    .tc-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
    }
    .tc-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .tc-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tc-tag {
      font-size: 0.72rem;
      background: var(--tag-bg);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
    }

    /* Topic Hero Banner & Table of Contents */
    .hero {
      background: radial-gradient(circle at 85% 15%, #1e293b 0%, #161b22 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: 2.1rem;
      color: var(--text-bright);
      margin-bottom: 8px;
    }
    .hero .sub {
      color: var(--text-muted);
      font-size: 1.02rem;
      margin-bottom: 16px;
    }
    .hero .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hero .tag {
      font-size: 0.75rem;
      background: var(--tag-bg);
      color: var(--accent);
      border: 1px solid var(--card-border);
      padding: 3px 9px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
    }

    .toc {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 24px;
      margin-bottom: 30px;
    }
    .toc-h {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-bright);
      margin-bottom: 10px;
    }
    .toc ol {
      margin-left: 20px;
      column-count: 2;
      column-gap: 32px;
    }
    .toc li {
      font-size: 0.92rem;
      margin-bottom: 6px;
    }
    .toc a {
      color: var(--accent);
      text-decoration: none;
    }
    .toc a:hover { text-decoration: underline; }

    /* Headings & Text */
    h1 {
      font-size: 2.2rem;
      color: var(--text-bright);
      margin-bottom: 12px;
    }
    h2 {
      font-size: 1.45rem;
      color: var(--text-bright);
      margin: 36px 0 14px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    h3 {
      font-size: 1.15rem;
      color: var(--accent-hover);
      margin: 22px 0 10px 0;
    }
    h4 {
      font-size: 1rem;
      color: var(--text-bright);
      margin-bottom: 6px;
    }
    p { margin-bottom: 12px; }
    ul, ol { margin-left: 22px; margin-bottom: 14px; }
    li { margin-bottom: 5px; }
    hr {
      border: none;
      border-top: 1px solid var(--card-border);
      margin: 32px 0;
    }

    /* Diagrams (.diagram & .mermaid) */
    .diagram {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      margin: 18px 0;
      overflow-x: auto;
    }
    .diagram-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-family: 'Fira Code', monospace;
    }
    .mermaid {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60px;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    /* Tables (.tw) */
    .tw {
      width: 100%;
      overflow-x: auto;
      margin: 18px 0;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card-bg);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      text-align: left;
    }
    th {
      background: var(--tag-bg);
      color: var(--text-bright);
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      color: var(--text);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

    /* Code Blocks */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      font-family: 'Fira Code', monospace;
      font-size: 0.86rem;
      color: #79c0ff;
      margin: 18px 0;
      line-height: 1.55;
      position: relative;
    }
    code {
      font-family: 'Fira Code', monospace;
      font-size: 0.86em;
      background: var(--tag-bg);
      color: #ff7b72;
      padding: 2px 6px;
      border-radius: 4px;
    }
    pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    /* Multi-column Cards (.g2, .card, .aws-g, .aws-card) */
    .g2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
      margin: 18px 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .aws-g {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin: 18px 0;
    }
    .aws-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .aws-head {
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
      font-size: 1.05rem;
    }
    .aws-items {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Callout Boxes (.box) */
    .box {
      border-left: 4px solid var(--accent);
      background: rgba(88, 166, 255, 0.08);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      margin: 18px 0;
      font-size: 0.92rem;
    }
    .box.tip {
      border-left-color: #3fb950;
      background: rgba(63, 185, 80, 0.08);
    }
    .box.warn {
      border-left-color: var(--warning);
      background: rgba(210, 153, 34, 0.08);
    }

    @media (max-width: 768px) {
      .toc ol { column-count: 1; }
    }
    .ph { 
      display: none !important; 
    }
  </style>
</head>
<body>

    <div class="top-nav-inner">
      <a href="{{ site.baseurl }}/" class="nav-logo">📚 Notes</a>
      <div class="nav-links">
        <a href="{{ site.baseurl }}/">All Topics</a>
        <a href="{{ site.baseurl }}/sql.html">SQL</a>
        <a href="{{ site.baseurl }}/java.html">Java</a>
        <a href="{{ site.baseurl }}/aws.html">AWS</a>
        <a href="{{ site.baseurl }}/docker.html">Docker</a>
        <a href="{{ site.baseurl }}/cicd.html">CI/CD</a>
        <a href="{{ site.baseurl }}/jenkins.html">Jenkins</a>
        <a href="{{ site.baseurl }}/python.html">Python</a>
        <a href="{{ site.baseurl }}/airflow.html">Airflow</a>
        <a href="{{ site.baseurl }}/data-engineer.html">Data Eng</a>
        <a href="{{ site.baseurl }}/git.html">Git</a>
      </div>
    </div>
  </nav>

  <div class="container">
    {{ content }}
  </div>

</body>
</html>
