<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }}{% unless page.url == '/' or page.url == '/notes/' %} | Naveen Kumar{% endunless %}</title>

  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="https://naveenkumar1661997.github.io/notes/"/>
  <meta property="og:title"       content="Naveen Kumar | Tech Knowledge Hub"/>
  <meta property="og:description" content="Senior Software Engineer at SmartStream Technologies. SQL, Java, AWS, Python, Docker, Airflow and Data Engineering notes — built for fast revision."/>
  <meta name="twitter:card"       content="summary_large_image"/>
  <meta name="twitter:title"      content="Naveen Kumar | Tech Knowledge Hub"/>
  <meta name="twitter:description"content="SQL, Java, AWS, Python, Docker, Airflow notes by Naveen Kumar — Senior Software Engineer, Bengaluru"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:       #090E1A;
      --surface:  #111827;
      --card:     #1A2236;
      --border:   #1E2D45;
      --accent:   #3B82F6;
      --accent2:  #06B6D4;
      --green:    #10B981;
      --yellow:   #F59E0B;
      --red:      #EF4444;
      --purple:   #8B5CF6;
      --text:     #E2E8F0;
      --muted:    #64748B;
      --code-bg:  #0D1526;
      --r:        8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.75;min-height:100vh}

    /* ── NAV ── */
    nav{
      position:sticky;top:0;z-index:100;
      background:rgba(9,14,26,.97);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:.75rem;
      padding:0 1.5rem;height:54px;
    }
    .nav-brand{
      font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.9rem;
      color:var(--accent2);text-decoration:none;display:flex;align-items:center;gap:6px;
    }
    .nav-brand .nb{color:var(--accent);opacity:.7}
    .nav-sp{flex:1}
    .nav-link{color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:500;padding:4px 10px;border-radius:6px;transition:.15s}
    .nav-link:hover{color:var(--text);background:var(--card)}
    .nav-li{
      background:rgba(10,102,194,.15);color:#60A5FA;
      border:1px solid rgba(59,130,246,.3);border-radius:6px;
      padding:3px 12px;font-size:.78rem;font-weight:600;
      text-decoration:none;transition:.15s;
    }
    .nav-li:hover{background:rgba(59,130,246,.25);color:#93C5FD}

    /* ── PAGE LAYOUT ── */
    .wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 54px)}

    /* ── SIDEBAR ── */
    aside{
      border-right:1px solid var(--border);
      padding:1.25rem .75rem;
      position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;
    }
    aside::-webkit-scrollbar{width:3px}
    aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .sb-sec{margin-bottom:1.25rem}
    .sb-lbl{
      font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:var(--muted);padding:0 8px;margin-bottom:4px;display:block;
    }
    .sb-link{
      display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
      color:var(--muted);text-decoration:none;font-size:.82rem;font-weight:500;
      transition:.15s;white-space:nowrap;overflow:hidden;
    }
    .sb-link:hover{color:var(--text);background:var(--card)}
    .sb-link.active{color:var(--accent2);background:rgba(6,182,212,.1);font-weight:600}
    .sb-dot{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
    .dot-done{background:var(--green)}

    /* ── MAIN CONTENT ── */
    main{padding:2rem 2.5rem;max-width:920px;width:100%}

    /* ── HEADINGS ── */
    h1{font-family:'JetBrains Mono',monospace;font-size:1.75rem;font-weight:700;margin-bottom:.4rem;color:var(--text)}
    h2{
      font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;
      color:var(--accent2);margin:2.5rem 0 .9rem;padding-bottom:.5rem;
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:6px;
    }
    h2::before{content:'##';color:var(--accent);opacity:.35;font-size:.82rem}
    h3{font-size:.95rem;font-weight:700;color:var(--text);margin:1.25rem 0 .4rem}
    h4{font-size:.78rem;font-weight:700;color:var(--muted);margin:.9rem 0 .3rem;text-transform:uppercase;letter-spacing:.06em}
    p{margin-bottom:.65rem;color:var(--text)}
    ul,ol{padding-left:1.5rem;margin:.4rem 0}
    li{margin:3px 0;font-size:.88rem;color:var(--text)}
    hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
    strong{color:var(--text)}

    /* ── HERO ── */
    .hero{
      background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(6,182,212,.04));
      border:1px solid var(--border);border-radius:12px;
      padding:1.5rem 2rem;margin-bottom:1.75rem;
    }
    .hero .sub{color:var(--muted);font-size:.85rem;margin-top:4px;margin-bottom:0}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:.75rem}
    .tag{
      font-size:.7rem;font-weight:600;padding:2px 9px;
      border-radius:999px;border:1px solid var(--border);color:var(--muted);
    }

    /* ── CALLOUT BOXES ── */
    .box{
      border-left:3px solid;padding:.7rem 1rem;
      border-radius:0 var(--r) var(--r) 0;margin:.9rem 0;font-size:.85rem;
    }
    .box b{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .tip {border-color:var(--green); background:rgba(16,185,129,.07)}
    .tip  b{color:var(--green)}
    .info{border-color:var(--accent2);background:rgba(6,182,212,.07)}
    .info b{color:var(--accent2)}
    .warn{border-color:var(--yellow);background:rgba(245,158,11,.07)}
    .warn b{color:var(--yellow)}
    .note{border-color:var(--purple);background:rgba(139,92,246,.07)}
    .note b{color:var(--purple)}

    /* ── CODE ── */
    code{
      font-family:'Fira Code',monospace;font-size:.82em;
      background:var(--code-bg);padding:2px 6px;
      border-radius:4px;color:var(--accent2);border:1px solid var(--border);
    }
    pre{
      background:var(--code-bg);border:1px solid var(--border);
      border-radius:var(--r);padding:1.1rem 1.25rem;
      overflow-x:auto;margin:.9rem 0;position:relative;
    }
    pre::after{
      content:attr(data-lang);position:absolute;top:7px;right:10px;
      font-size:.65rem;font-weight:700;text-transform:uppercase;
      color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;
    }
    pre code{font-size:.82rem;background:none;padding:0;border:none;color:var(--text);line-height:1.65}

    /* ── TABLES ── */
    .tw{overflow-x:auto;margin:.9rem 0;border-radius:var(--r);border:1px solid var(--border)}
    table{width:100%;border-collapse:collapse;min-width:400px}
    th{
      background:var(--card);font-family:'JetBrains Mono',monospace;
      font-size:.7rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.06em;color:var(--muted);padding:9px 12px;
      text-align:left;border-bottom:1px solid var(--border);
    }
    td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:.84rem;vertical-align:top;color:var(--text)}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.015)}
    td code{font-size:.78rem}

    /* ── MERMAID DIAGRAMS ── */
    .diagram{
      background:var(--code-bg);border:1px solid var(--border);
      border-radius:var(--r);padding:1.25rem 1rem;
      margin:.9rem 0;overflow-x:auto;text-align:center;
    }
    .diagram-label{
      font-size:.68rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.08em;color:var(--muted);text-align:right;
      margin-bottom:8px;font-family:'JetBrains Mono',monospace;
    }
    .mermaid{display:flex;justify-content:center;align-items:center;min-height:60px}
    .mermaid svg{max-width:100%;height:auto}

    /* ── TOC ── */
    .toc{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--r);padding:.9rem 1.1rem;margin:1.25rem 0;font-size:.85rem;
    }
    .toc-h{font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
    .toc ol{padding-left:1.1rem;margin:0}
    .toc li{margin:3px 0}
    .toc a{color:var(--muted);text-decoration:none}
    .toc a:hover{color:var(--accent2)}

    /* ── GRID UTILITIES ── */
    .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin:.75rem 0}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:.75rem 0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem}
    .card h4{margin:0 0 6px;color:var(--accent2);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
    .card p{font-size:.82rem;color:var(--muted);margin:0}

    /* ── AWS CARDS ── */
    .aws-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin:.75rem 0}
    .aws-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
    .aws-head{font-weight:700;font-size:.85rem;margin-bottom:.5rem;color:var(--text)}
    .aws-items{font-size:.8rem;color:var(--muted);line-height:1.75}

    /* ── PORTFOLIO HERO (index page) ── */
    .ph{
      background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(6,182,212,.06),rgba(139,92,246,.05));
      border:1px solid var(--border);border-radius:16px;
      padding:2rem 2.25rem;margin-bottom:2rem;position:relative;overflow:hidden;
    }
    .ph::before{
      content:'';position:absolute;top:-60px;right:-60px;
      width:200px;height:200px;border-radius:50%;
      background:radial-gradient(circle,rgba(59,130,246,.12),transparent 70%);
      pointer-events:none;
    }
    .ph-row{display:flex;align-items:flex-start;gap:1.5rem}
    .ph-avatar{
      width:72px;height:72px;border-radius:16px;flex-shrink:0;
      background:linear-gradient(135deg,#3B82F6,#06B6D4);
      display:flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-weight:700;
      font-size:1.4rem;color:#fff;
      box-shadow:0 0 24px rgba(59,130,246,.35);
    }
    .ph-name{font-family:'JetBrains Mono',monospace;font-size:1.55rem;font-weight:700;margin-bottom:3px;color:var(--text)}
    .ph-role{font-size:.9rem;color:var(--accent2);font-weight:600;margin-bottom:2px}
    .ph-company{font-size:.82rem;color:var(--muted);margin-bottom:.75rem}
    .ph-bio{font-size:.85rem;color:var(--muted);max-width:540px;line-height:1.65;margin-bottom:.9rem}
    .ph-stack{display:flex;gap:8px;flex-wrap:wrap}
    .ph-pill{
      font-size:.75rem;font-weight:600;padding:4px 12px;border-radius:999px;
      background:var(--card);border:1px solid var(--border);color:var(--text);
    }
    .ph-stats{
      display:flex;gap:2rem;margin-top:1.25rem;padding-top:1.25rem;
      border-top:1px solid var(--border);
    }
    .ph-stat-n{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--accent2);line-height:1}
    .ph-stat-l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

    /* ── TOPIC CARDS ── */
    .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:.9rem;margin-top:1.25rem}
    .tc{
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:1.1rem 1.25rem;text-decoration:none;display:block;
      transition:border-color .2s,transform .15s,box-shadow .2s;
      position:relative;overflow:hidden;
    }
    .tc:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
    .tc-stripe{height:3px;border-radius:2px;margin-bottom:.9rem}
    .tc-icon{font-size:1.4rem;margin-bottom:6px}
    .tc-title{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:4px}
    .tc-desc{font-size:.78rem;color:var(--muted);line-height:1.55}
    .tc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:.7rem}
    .tc-tag{font-size:.63rem;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
    .tc-status{position:absolute;top:10px;right:10px;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:999px}
    .s-done{background:rgba(16,185,129,.15);color:var(--green)}

    @media(max-width:900px){
      .wrap{grid-template-columns:1fr}
      aside{display:none}
      main{padding:1.25rem 1rem}
      .ph-row{flex-direction:column}
      .g2{grid-template-columns:1fr}
      .ph-stats{gap:1.25rem}
    }
  </style>
</head>

<script>
  (function () {
    var cfg = {
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
      themeVariables: {
        primaryColor:       '#1A2236',
        primaryTextColor:   '#E2E8F0',
        primaryBorderColor: '#1E2D45',

        secondaryColor:     '#111827',
        tertiaryColor:      '#0D1526',
        background:         '#090E1A',
        mainBkg:            '#1A2236',
        nodeBorder:         '#1E2D45',
        clusterBkg:         '#111827',
        titleColor:         '#E2E8F0',
        edgeLabelBackground:'#1A2236',
        fontFamily:         "'JetBrains Mono', monospace"
      }
    };

    function runMermaid() {
      mermaid.initialize(cfg);
      mermaid.run({ querySelector: '.mermaid' });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runMermaid);
    } else {
      runMermaid();
    }
  })();
</script>
