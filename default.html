<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | Dev Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg:         #0D1117;
      --surface:    #161B22;
      --card:       #21262D;
      --border:     #30363D;
      --accent:     #7C3AED;
      --accent2:    #06B6D4;
      --accent3:    #10B981;
      --warn:       #F59E0B;
      --danger:     #EF4444;
      --text:       #E6EDF3;
      --muted:      #8B949E;
      --code-bg:    #1C2128;
      --radius:     8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,17,23,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 2rem;
      height: 56px;
    }
    .nav-brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent2);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-brand::before { content: '>_'; color: var(--accent); }
    .nav-spacer { flex: 1; }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      transition: color .2s, background .2s;
    }
    .nav-link:hover { color: var(--text); background: var(--card); }

    /* ── LAYOUT ── */
    .page-wrapper {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 56px);
    }

    /* ── SIDEBAR ── */
    aside {
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .sidebar-section { margin-bottom: 1.5rem; }
    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all .15s;
    }
    .sidebar-link:hover { color: var(--text); background: var(--card); }
    .sidebar-link.active { color: var(--accent2); background: rgba(6,182,212,.08); }
    .sidebar-badge {
      margin-left: auto;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
    }
    .badge-done   { background: rgba(16,185,129,.15); color: var(--accent3); }
    .badge-wip    { background: rgba(245,158,11,.15);  color: var(--warn); }

    /* ── CONTENT ── */
    main {
      padding: 2.5rem 3rem;
      max-width: 900px;
    }

    /* ── HEADINGS ── */
    h1 { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
    h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent2);
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::before { content: '##'; color: var(--accent); opacity: .5; font-size: .9rem; }
    h3 { font-size: 1rem; font-weight: 700; color: var(--text); margin: 1.5rem 0 0.5rem; }
    h4 { font-size: .9rem; font-weight: 600; color: var(--muted); margin: 1rem 0 0.3rem; text-transform: uppercase; letter-spacing: .05em; }

    p { margin-bottom: 0.75rem; color: var(--text); }

    /* ── PAGE HERO ── */
    .page-hero {
      background: linear-gradient(135deg, rgba(124,58,237,.1) 0%, rgba(6,182,212,.05) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
    }
    .page-hero .subtitle { color: var(--muted); font-size: 0.875rem; margin-top: 4px; margin-bottom: 0; }
    .tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 1rem; }
    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── CALLOUTS ── */
    .callout {
      border-left: 3px solid;
      padding: 0.75rem 1rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 1rem 0;
      font-size: 0.875rem;
    }
    .callout-title { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .callout.tip    { border-color: var(--accent3); background: rgba(16,185,129,.06); }
    .callout.tip .callout-title { color: var(--accent3); }
    .callout.warn   { border-color: var(--warn); background: rgba(245,158,11,.06); }
    .callout.warn .callout-title { color: var(--warn); }
    .callout.info   { border-color: var(--accent2); background: rgba(6,182,212,.06); }
    .callout.info .callout-title { color: var(--accent2); }
    .callout.danger { border-color: var(--danger); background: rgba(239,68,68,.06); }
    .callout.danger .callout-title { color: var(--danger); }

    /* ── CODE ── */
    code {
      font-family: 'Fira Code', monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent2);
      border: 1px solid var(--border);
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      margin: 1rem 0;
      position: relative;
    }
    pre::before {
      content: attr(data-lang);
      position: absolute;
      top: 8px; right: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em;
    }
    pre code {
      font-size: 0.875rem;
      background: none;
      padding: 0;
      border: none;
      color: var(--text);
      line-height: 1.6;
    }

    /* ── TABLES ── */
    .table-wrap { overflow-x: auto; margin: 1rem 0; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--card);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.875rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    td code { font-size: 0.8rem; }

    /* ── DIAGRAM BOXES ── */
    .diagram-wrap {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 1rem 0;
      overflow-x: auto;
    }
    .mermaid { display: flex; justify-content: center; }

    /* ── JOIN GRID ── */
    .join-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .join-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .join-card h4 { color: var(--accent2); margin: 0 0 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; }
    .join-card p  { font-size: 0.8rem; color: var(--muted); margin: 4px 0 8px; }
    .join-card svg { display: block; margin: 0 auto; }

    /* ── KEYWORD GRID ── */
    .kw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 1rem 0; }
    .kw-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .kw-item .kw { font-family: 'Fira Code', monospace; color: var(--accent2); font-size: 0.85rem; font-weight: 600; }
    .kw-item .kd { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

    /* ── ACID CARDS ── */
    .acid-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
    .acid-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .acid-letter { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; line-height: 1; }
    .acid-word   { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
    .acid-desc   { font-size: 0.825rem; color: var(--muted); }

    /* ── TOC ── */
    .toc {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      font-size: 0.875rem;
    }
    .toc-title { font-weight: 700; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .toc ol { padding-left: 1.25rem; }
    .toc li { margin: 3px 0; }
    .toc a { color: var(--muted); text-decoration: none; }
    .toc a:hover { color: var(--accent2); }

    /* ── NORM TABLE ── */
    .norm-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin: 8px 0; }
    .norm-badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .n1 { background: rgba(124,58,237,.2); color: #A78BFA; }
    .n2 { background: rgba(6,182,212,.15); color: var(--accent2); }
    .n3 { background: rgba(16,185,129,.15); color: var(--accent3); }
    .nb { background: rgba(245,158,11,.15); color: var(--warn); }

    ul, ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    li { margin: 4px 0; font-size: 0.9rem; }

    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }

    /* ── INDEX CARDS ── */
    .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .topic-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      text-decoration: none;
      display: block;
      transition: border-color .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .topic-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .2s;
    }
    .topic-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .topic-card:hover::before { opacity: 1; }
    .tc-icon { font-size: 1.5rem; margin-bottom: 8px; }
    .tc-title { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .tc-desc  { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .tc-tags  { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .tc-tag   { font-size: 0.65rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .tc-status{ position: absolute; top: 10px; right: 10px; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .s-done   { background: rgba(16,185,129,.15); color: var(--accent3); }
    .s-wip    { background: rgba(245,158,11,.15); color: var(--warn); }
    .s-soon   { background: rgba(139,148,158,.1); color: var(--muted); }

    @media (max-width: 768px) {
      .page-wrapper { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 1.5rem; }
      .acid-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/" class="nav-brand">DevNotes</a>
    <span class="nav-spacer"></span>
    <a href="{{ site.baseurl }}/" class="nav-link">Home</a>
    <a href="{{ site.baseurl }}/sql.html" class="nav-link">SQL</a>
    <a href="https://github.com/naveenkumar1661997/notes" class="nav-link" target="_blank">GitHub ↗</a>
  </nav>

  <div class="page-wrapper">
    <aside>
      <div class="sidebar-section">
        <div class="sidebar-label">Database</div>
        <a href="{{ site.baseurl }}/sql.html" class="sidebar-link {% if page.url contains 'sql' %}active{% endif %}">
          🗄️ SQL
          <span class="sidebar-badge badge-done">Done</span>
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Frontend</div>
        <a href="#" class="sidebar-link">⚡ JavaScript
          <span class="sidebar-badge badge-wip">WIP</span>
        </a>
        <a href="#" class="sidebar-link">⚛️ React
          <span class="sidebar-badge">Soon</span>
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Backend</div>
        <a href="#" class="sidebar-link">🟢 Node.js
          <span class="sidebar-badge">Soon</span>
        </a>
        <a href="#" class="sidebar-link">🐍 Python
          <span class="sidebar-badge">Soon</span>
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Architecture</div>
        <a href="#" class="sidebar-link">🏗️ System Design
          <span class="sidebar-badge">Soon</span>
        </a>
        <a href="#" class="sidebar-link">🔗 REST / GraphQL
          <span class="sidebar-badge">Soon</span>
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">DevOps</div>
        <a href="#" class="sidebar-link">🐳 Docker
          <span class="sidebar-badge">Soon</span>
        </a>
        <a href="#" class="sidebar-link">☸️ Kubernetes
          <span class="sidebar-badge">Soon</span>
        </a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">CS Fundamentals</div>
        <a href="#" class="sidebar-link">🧮 DSA
          <span class="sidebar-badge">Soon</span>
        </a>
        <a href="#" class="sidebar-link">🌐 Networking
          <span class="sidebar-badge">Soon</span>
        </a>
      </div>
    </aside>

    <main>
      {{ content }}
    </main>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark', themeVariables: {
      primaryColor: '#7C3AED',
      primaryTextColor: '#E6EDF3',
      primaryBorderColor: '#30363D',
      lineColor: '#30363D',
      secondaryColor: '#21262D',
      tertiaryColor: '#161B22',
      background: '#0D1117',
      mainBkg: '#21262D',
      nodeBorder: '#30363D',
      clusterBkg: '#161B22',
      titleColor: '#E6EDF3',
      edgeLabelBackground: '#21262D',
      fontFamily: 'JetBrains Mono, monospace',
    }});
  </script>
</body>
</html>
